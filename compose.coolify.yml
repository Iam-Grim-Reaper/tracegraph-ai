# TraceGraph AI backend for Git-linked Coolify Docker Compose.
# From repository root. Configure api domain for container port 8080 in Coolify.
# Qdrant and Neo4j intentionally have no published host ports.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    depends_on:
      - qdrant
      - neo4j
    expose:
      - "8080"
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      PORT: "8080"
      FRONTEND_URL: ${FRONTEND_URL:?Set the production Vercel frontend URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set allowed browser origins}
      PUBLIC_UPLOADS_ENABLED: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set Gemini API key as a Coolify secret}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set a strong Qdrant API key}
      QDRANT_HYBRID_COLLECTION: tracegraph_chunks_hybrid
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set a strong Neo4j password}
      NEO4J_DATABASE: neo4j
      GRAPH_EXTRACTION_CACHE_DIR: /app/runtime/cache/graph_extractions
      RERANKER_MODEL_NAME: /app/models/reranker
    volumes:
      - graph-extraction-cache:/app/runtime/cache/graph_extractions
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=15).close()"]
      interval: 30s
      timeout: 20s
      start_period: 120s
      retries: 4

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set a strong Qdrant API key}
    volumes:
      - qdrant-data:/qdrant/storage

  neo4j:
    image: neo4j:5.26
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set a strong Neo4j password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

volumes:
  qdrant-data:
  neo4j-data:
  neo4j-logs:
  graph-extraction-cache:
