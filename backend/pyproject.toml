[project]
name = "tracegraph-backend"
version = "0.1.0"
description = "FastAPI backend for TraceGraph AI"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
