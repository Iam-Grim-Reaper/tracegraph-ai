name: Public demo corpus — controlled indexing

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preflight only, index all approved files, or verify ready status"
        type: choice
        options:
          - preflight
          - index
          - verify
        default: preflight
        required: true

permissions:
  contents: read

concurrency:
  group: tracegraph-public-demo-index
  cancel-in-progress: false

jobs:
  seed-public-demo:
    name: Approved three-document corpus
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.11
      - run: uv sync --frozen
      - name: Validate fixed files and extraction
        run: uv run --no-sync python tools/seed_public_demo.py --mode preflight
      - name: Confirm production credentials are configured
        if: inputs.mode != 'preflight'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          for name in GEMINI_API_KEY QDRANT_URL QDRANT_API_KEY NEO4J_URI NEO4J_USERNAME NEO4J_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Run approved indexing or verification
        if: inputs.mode != 'preflight'
        env:
          APP_ENV: production
          DEBUG: 'false'
          PUBLIC_UPLOADS_ENABLED: 'false'
          PUBLIC_DEMO_ONLY: 'true'
          CORS_ALLOWED_ORIGINS: https://tracegraph-ai.vercel.app
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          QDRANT_HYBRID_COLLECTION: ${{ vars.QDRANT_HYBRID_COLLECTION || 'tracegraph_chunks_hybrid' }}
          NEO4J_DATABASE: ${{ vars.NEO4J_DATABASE || 'neo4j' }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'gemini-embedding-2' }}
          EMBEDDING_DIMENSIONS: ${{ vars.EMBEDDING_DIMENSIONS || '768' }}
          CONTEXTUALIZATION_MODEL: ${{ vars.CONTEXTUALIZATION_MODEL || 'gemini-3.5-flash-lite' }}
          GRAPH_EXTRACTION_MODEL: ${{ vars.GRAPH_EXTRACTION_MODEL || 'gemini-3.5-flash-lite' }}
          GENERATION_MODEL: ${{ vars.GENERATION_MODEL || 'gemini-3.6-flash' }}
          RERANKER_MODEL_NAME: ${{ vars.RERANKER_MODEL_NAME || 'cross-encoder/ms-marco-MiniLM-L6-v2' }}
        run: |
          uv run --no-sync python tools/seed_public_demo.py --mode "${{ inputs.mode }}"
