name: Demo corpus - one-time credential readiness

on:
  push:
    branches:
      - ops/demo-secret-check-20261112

permissions:
  contents: read

jobs:
  check:
    name: Protected service credentials present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check only presence of required secrets (no values printed)
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          missing=0
          for name in GEMINI_API_KEY QDRANT_URL QDRANT_API_KEY NEO4J_URI NEO4J_USERNAME NEO4J_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "MISSING: $name (value not printed)"
              missing=1
            else
              echo "PRESENT: $name (value not printed)"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Cannot run production ingestion without GitHub Actions credentials."
            exit 1
          fi
          echo "All six protected credentials are available."
