name: Seed TraceGraph demo corpus (one-time operator run)

on:
  push:
    branches:
      - ops/seed-demo-once-20261112

permissions:
  contents: read

concurrency:
  group: tracegraph-public-demo-index
  cancel-in-progress: false

jobs:
  seed-approved-documents:
    name: Verify and index the approved three files
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.11
      - run: uv sync --frozen
      - name: Validate all three approved source documents
        run: uv run --no-sync python tools/seed_public_demo.py --mode preflight
      - name: Verify that required protected credentials exist
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          for key in GEMINI_API_KEY QDRANT_URL QDRANT_API_KEY NEO4J_URI NEO4J_USERNAME NEO4J_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Required secret is missing: $key"
              exit 1
            fi
          done
      - name: Index approved corpus to production databases and verify
        env:
          APP_ENV: production
          DEBUG: 'false'
          PUBLIC_UPLOADS_ENABLED: 'false'
          PUBLIC_DEMO_ONLY: 'true'
          CORS_ALLOWED_ORIGINS: https://tracegraph-ai.vercel.app
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          QDRANT_HYBRID_COLLECTION: ${{ vars.QDRANT_HYBRID_COLLECTION || 'tracegraph_chunks_hybrid' }}
          NEO4J_DATABASE: ${{ vars.NEO4J_DATABASE || '18289c8f' }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'gemini-embedding-2' }}
          EMBEDDING_DIMENSIONS: ${{ vars.EMBEDDING_DIMENSIONS || '768' }}
          CONTEXTUALIZATION_MODEL: ${{ vars.CONTEXTUALIZATION_MODEL || 'gemini-3.5-flash-lite' }}
          GRAPH_EXTRACTION_MODEL: ${{ vars.GRAPH_EXTRACTION_MODEL || 'gemini-3.5-flash-lite' }}
          GENERATION_MODEL: ${{ vars.GENERATION_MODEL || 'gemini-3.6-flash' }}
          RERANKER_MODEL_NAME: ${{ vars.RERANKER_MODEL_NAME || 'cross-encoder/ms-marco-MiniLM-L6-v2' }}
        run: uv run --no-sync python tools/seed_public_demo.py --mode index
